simulation:
  dt: 0.1
  max_duration: 1200.0
  goal_tolerance: 5.0
  collision_radius: 2.0
  terminate_on_collision: true
  terminate_on_grounding: true
world:
  width: 100
  height: 100
  cell_size: 10.0
  # Depth / under-keel clearance (G7). "none" = binary land/water (frozen v1);
  # "shoaling" synthesizes a depth field shoaling toward land. See WorldConfig.
  depth_model: none
  ukc_margin: 0.5
  deep_depth: 20.0
  shoal_slope: 0.25
vessel:
  # ~30 m small craft to scale (cell_size = 10 m): cruise 5 m/s (~9.7 kn),
  # K=0.12 => ~4.2 deg/s steady yaw, turn radius ~6.8 cells (~68 m).
  model: fossen3
  cruise_speed: 0.5
  max_speed: 0.8
  nomoto_K: 0.12
  nomoto_T: 3.0
  max_rudder_deg: 35.0
  rudder_rate_deg: 6.363636363636363
  sway_time_constant: 2.0
  sideslip_gain: 1.2
  turn_speed_loss: 0.4
  surge_time_constant: 4.0
  draft: 2.0
environment:
  current_speed: 0.0
  current_direction_deg: 0.0
  wind_gust_accel: 0.0
  randomize: false
  max_random_current: 0.3
perception:
  enabled: false
  position_noise: 0.0
  course_noise_deg: 0.0
  speed_noise: 0.0
  update_interval: 0.0
  dropout_prob: 0.0
control:
  heading_kp: 1.0
  heading_kd: 1.5
  slowdown_start_deg: 15.0
  slowdown_full_deg: 60.0
  min_speed_factor: 1.0          # 1.0 = course-only (no speed reduction in turns)
planner:
  safety_margin: 7
  max_segment_length: 15.0
follower:
  type: ilos
  lookahead: 10.0
  path_tolerance: 4.0
  integral_gain: 0.5
  turn_radius: 7.0               # wheel-over turn anticipation (cells); 0 disables
avoidance:
  implementation: predictive
  safe_distance: 10.0
  warning_distance: 18.0
  detector_safe_distance: 8.0
  detector_warning_distance: 15.0
  time_horizon: 60.0
  avoidance_angle_deg: 30.0
ship_domain:                     # all 1.0 = circular (frozen v1 scoring)
  fore: 1.0
  aft: 1.0
  starboard: 1.0
  port: 1.0
rl:
  action_repeat: 5
  n_lidar_rays: 16
  lidar_range: 40.0
  n_tracked_obstacles: 3
  heading_actions_deg:
  - -30.0
  - -15.0
  - -5.0
  - 0.0
  - 5.0
  - 15.0
  - 30.0
  # G5: "steer_speed" gives the policy a compound (heading, speed) action so
  # it can modulate engine orders like the classical/MPC baselines;
  # "steer_only" pins speed to cruise for ablation. speed_factors x cruise_speed.
  action_mode: steer_speed
  speed_factors:
  - 1.0
  - 0.75
  - 0.5
  reward:
    goal_reached: 100.0
    collision: -100.0
    grounding: -100.0
    out_of_bounds: -50.0
    time_penalty: -0.05
    progress_scale: 1.0
    near_miss: -0.5
    heading_change_penalty: -0.02
    land_proximity: -0.3
    land_proximity_range: 8.0
training:
  total_timesteps: 300000
  n_envs: 8
  seed: 42
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 512
  gamma: 0.995
  ent_coef: 0.01
  scenario: random
  model_dir: models
  log_dir: runs
