name: Deploy leaderboard to GitHub Pages

# Publishes the committed benchmark results as a static leaderboard site.
# VesselNav-Bench v2 is the main page (/); v1 is archived at /v1/, with a
# header link between them. Until v2 results are committed, the site root
# falls back to v1 so the page never breaks. The HTML is regenerated from
# results.json at deploy time so the page always matches the committed numbers.
#
on:
  push:
    branches: [main]
    paths:
      - "reports/v1/benchmark-v1/results.json"
      - "reports/v2/benchmark/results.json"
      - "src/evaluation/html_report.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build leaderboard site (v2 main, v1 archived)
        run: |
          python - <<'EOF'
          import importlib.util, shutil
          from pathlib import Path

          # html_report is pure-stdlib; load it straight from its file so the
          # import doesn't run src/evaluation/__init__.py, which pulls in
          # numpy/torch/SB3 that this static-site job deliberately doesn't install.
          spec = importlib.util.spec_from_file_location(
              "html_report", "src/evaluation/html_report.py")
          html_report = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(html_report)
          write_html = html_report.write_html

          A = 'style="color:#5dd39e;text-decoration:none"'
          NAV_TO_V1 = f'<p style="margin:.2em 0 1.2em"><a {A} href="v1/">&rarr; VesselNav-Bench v1 (archived)</a></p>'
          NAV_TO_V2 = f'<p style="margin:.2em 0 1.2em"><a {A} href="../">&larr; VesselNav-Bench v2 (current)</a></p>'

          site = Path("_site"); site.mkdir(exist_ok=True)
          v1 = Path("reports/v1/benchmark-v1")
          v2 = Path("reports/v2/benchmark")

          if (v2 / "results.json").exists():
              # v2 is the main page, v1 archived under /v1/.
              write_html(v2 / "results.json", site / "index.html", nav_link=NAV_TO_V1)
              shutil.copy(v2 / "leaderboard.md", site / "leaderboard.md")
              (site / "v1").mkdir(exist_ok=True)
              write_html(v1 / "results.json", site / "v1" / "index.html", nav_link=NAV_TO_V2)
              shutil.copy(v1 / "leaderboard.md", site / "v1" / "leaderboard.md")
              print("Published v2 (main) + v1 (archived).")
          else:
              # No v2 results committed yet: keep v1 at the site root.
              write_html(v1 / "results.json", site / "index.html")
              shutil.copy(v1 / "leaderboard.md", site / "leaderboard.md")
              print("No v2 results committed yet; published v1 at root.")
          EOF
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically if the repo (or a fork) hasn't yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
